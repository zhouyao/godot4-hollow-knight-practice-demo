[plugin]

name="Zone Director"
description="可嵌套的 2D 区域系统：AuZone 之间互相包含，按 depth → zone_priority → 面积仲裁。surface / lighting 为互斥通道（唯一胜者），ambient / tags 为叠加通道。效果以 AuZoneBehavior 挂件形式可插拔，与 AuCameraDirector + AuCameraBehavior 同构。注意：本插件不自动安装 autoload，启用后请按 README 手动注册 AuZoneDirector。"
author="yao.zhou"
version="1.0"
script="plugin.gd"
